name: Build RJ CricX Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Generate APK and Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 1: JDK 17 Setup
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 2: Android SDK & local.properties
      - name: Setup Android SDK and Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Step 3: Poora Source Code, Custom Vector Launcher Icon & UI Setup
      - name: Setup RJ CricX Exact UI Design
        run: |
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RJ-CricX"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          mkdir -p app/src/main/java/com/rjcricx
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          touch app/proguard-rules.pro
          echo "sdk.dir=$ANDROID_HOME" > app/local.properties

          # REAL LAUNCHER ICON MATCHING TOP-LEFT GLOWING BADGE
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#070B14" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:strokeColor="#00E676" android:strokeWidth="3.5" android:pathData="M54,20 A34,34 0 1,0 54,88 A34,34 0 1,0 54,20 Z"/>
              <path android:fillColor="#C62828" android:pathData="M54,24 A30,30 0 1,0 54,84 A30,30 0 1,0 54,24 Z"/>
              <path android:strokeColor="#00E676" android:strokeWidth="5" android:strokeLineCap="round" android:pathData="M38,38 L70,70 M70,38 L38,70"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.rjcricx"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.rjcricx"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("playstore-release.keystore")
                      storePassword = "CricXPass@2026"
                      keyAlias = "rjcricx"
                      keyPassword = "CricXPass@2026"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
                  debug {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += listOf(
                      "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
                      "-opt-in=kotlin.RequiresOptIn"
                  )
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("androidx.compose.ui:ui:1.5.4")
              implementation("androidx.compose.ui:ui-graphics:1.5.4")
              implementation("androidx.compose.ui:ui-tooling-preview:1.5.4")
              implementation("androidx.compose.material3:material3:1.1.2")
              implementation("androidx.compose.animation:animation:1.5.4")
              implementation("androidx.compose.foundation:foundation:1.5.4")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="RJ CricX"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">RJ CricX</string>
          </resources>
          EOF

          # MAIN ACTIVITY: 100% CLONE OF YOUR SCREENSHOT
          cat << 'EOF' > app/src/main/java/com/rjcricx/MainActivity.kt
          package com.rjcricx

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.animation.*
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.delay
          import java.util.Locale

          data class BatterRecord(
              var name: String,
              val runs: Int = 0,
              val balls: Int = 0,
              val fours: Int = 0,
              val sixes: Int = 0,
              val isOut: Boolean = false,
              val dismissalText: String = "not out"
          ) {
              val strikeRate: Double get() = if (balls == 0) 0.0 else (runs.toDouble() * 100.0) / balls
              val strikeRateFormatted: String get() = String.format(Locale.US, "%.2f", strikeRate)
          }

          data class BowlerRecord(
              var name: String,
              val legalBalls: Int = 0,
              val maidens: Int = 0,
              val runsConceded: Int = 0,
              val wickets: Int = 0
          ) {
              val oversFormatted: String get() = "${legalBalls / 6}.${legalBalls % 6}"
              val economy: Double get() = if (legalBalls == 0) 0.0 else (runsConceded.toDouble() * 6.0) / legalBalls
              val economyFormatted: String get() = String.format(Locale.US, "%.2f", economy)
          }

          data class DeliveryItem(
              val badge: String,
              val runsTotal: Int,
              val isLegal: Boolean,
              val isWicket: Boolean
          )

          data class FallOfWicket(
              val wicketNum: Int,
              val score: Int,
              val batterName: String,
              val overs: String
          )

          enum class ScreenNav {
              LIVE, SCORECARD, SETTINGS
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme {
                          RJCricXProApp()
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun RJCricXProApp() {
              var currentNav by remember { mutableStateOf(ScreenNav.LIVE) }

              // Match Variables Matching Screenshot
              var battingTeam by remember { mutableStateOf("Royal Strikers") }
              var bowlingTeam by remember { mutableStateOf("Thunder Bolts") }
              var oversTotal by remember { mutableStateOf(6) }
              var inningsNum by remember { mutableStateOf(1) }
              var targetScore by remember { mutableStateOf<Int?>(null) }
              var totalScore by remember { mutableStateOf(19) }
              var wicketsLost by remember { mutableStateOf(0) }
              var totalLegalBalls by remember { mutableStateOf(6) }

              // Extras
              var wides by remember { mutableStateOf(0) }
              var noBalls by remember { mutableStateOf(0) }
              var byes by remember { mutableStateOf(0) }
              var legByes by remember { mutableStateOf(0) }

              // Players
              val batters = remember {
                  mutableStateListOf(
                      BatterRecord("Sameer (C)", runs = 0, balls = 0),
                      BatterRecord("Rohan (wk)", runs = 0, balls = 0)
                  )
              }
              val bowlers = remember {
                  mutableStateListOf(
                      BowlerRecord("Sunny (C)", legalBalls = 0, maidens = 0, runsConceded = 0, wickets = 0)
                  )
              }
              val deliveries = remember { mutableStateListOf<DeliveryItem>() }
              val fowList = remember { mutableStateListOf<FallOfWicket>() }

              var strikerIdx by remember { mutableStateOf(0) }
              var nonStrikerIdx by remember { mutableStateOf(1) }
              var bowlerIdx by remember { mutableStateOf(0) }

              // Commentary
              var commentaryText by remember { mutableStateOf("Match is live! Ball ready to be bowled.") }

              // Celebration Popups
              var celebrationBanner by remember { mutableStateOf<String?>(null) }
              var celebrationSub by remember { mutableStateOf("") }

              LaunchedEffect(celebrationBanner) {
                  if (celebrationBanner != null) {
                      delay(2200)
                      celebrationBanner = null
                  }
              }

              // Dialogs
              var openWicketModal by remember { mutableStateOf(false) }
              var openNewMatchModal by remember { mutableStateOf(false) }
              var openRenameModal by remember { mutableStateOf(false) }
              var renameTarget by remember { mutableStateOf("TEAM") } // TEAM, STRIKER, NON_STRIKER, BOWLER
              var renameInput by remember { mutableStateOf("") }

              var newTeamInput by remember { mutableStateOf("Royal Strikers") }
              var newOversInput by remember { mutableStateOf("6") }
              var dismissalMethod by remember { mutableStateOf("Caught") }
              var fielderInput by remember { mutableStateOf("") }
              var incomingBatterInput by remember { mutableStateOf("") }

              fun swapEnds() {
                  val temp = strikerIdx
                  strikerIdx = nonStrikerIdx
                  nonStrikerIdx = temp
              }

              fun recordDelivery(runsBat: Int, runsExtra: Int, isLegal: Boolean, displayBadge: String) {
                  val striker = batters.getOrNull(strikerIdx) ?: return
                  val bowler = bowlers.getOrNull(bowlerIdx) ?: return

                  batters[strikerIdx] = striker.copy(
                      runs = striker.runs + runsBat,
                      balls = striker.balls + (if (isLegal) 1 else 0),
                      fours = striker.fours + (if (runsBat == 4) 1 else 0),
                      sixes = striker.sixes + (if (runsBat == 6) 1 else 0)
                  )

                  bowlers[bowlerIdx] = bowler.copy(
                      runsConceded = bowler.runsConceded + (runsBat + runsExtra),
                      legalBalls = bowler.legalBalls + (if (isLegal) 1 else 0),
                      dotBalls = bowler.dotBalls + (if (runsBat == 0 && runsExtra == 0 && isLegal) 1 else 0)
                  )

                  totalScore += (runsBat + runsExtra)
                  if (isLegal) totalLegalBalls += 1

                  commentaryText = "${bowler.name} to ${striker.name}: $displayBadge, ${runsBat + runsExtra} runs added."

                  // 4 & 6 Celebrations
                  val updatedStriker = batters[strikerIdx]
                  if (runsBat == 4) {
                      celebrationBanner = "⚡ BOUNDARY FOUR! ⚡"
                      celebrationSub = "${updatedStriker.name}  ${updatedStriker.runs}* (${updatedStriker.balls})"
                  } else if (runsBat == 6) {
                      celebrationBanner = "🔥 MAXIMUM SIX! 🔥"
                      celebrationSub = "${updatedStriker.name}  ${updatedStriker.runs}* (${updatedStriker.balls})"
                  }

                  deliveries.add(DeliveryItem(badge = displayBadge, runsTotal = runsBat + runsExtra, isLegal = isLegal, isWicket = false))

                  if (runsBat % 2 != 0) {
                      swapEnds()
                  }
                  if (isLegal && totalLegalBalls % 6 == 0) {
                      swapEnds()
                      commentaryText = "End of over ${totalLegalBalls / 6}. Bowling side changing ends."
                  }
              }

              fun commitWicket() {
                  val striker = batters.getOrNull(strikerIdx) ?: return
                  val bowler = bowlers.getOrNull(bowlerIdx) ?: return

                  val dismissalText = when (dismissalMethod) {
                      "Bowled" -> "b ${bowler.name}"
                      "Caught" -> "c ${if (fielderInput.isBlank()) "Fielder" else fielderInput} b ${bowler.name}"
                      "LBW" -> "lbw b ${bowler.name}"
                      "Run Out" -> "run out (${if (fielderInput.isBlank()) "Fielder" else fielderInput})"
                      "Stumped" -> "st ${if (fielderInput.isBlank()) "Keeper" else fielderInput} b ${bowler.name}"
                      else -> "b ${bowler.name}"
                  }

                  batters[strikerIdx] = striker.copy(balls = striker.balls + 1, isOut = true, dismissalText = dismissalText)
                  bowlers[bowlerIdx] = bowler.copy(
                      wickets = bowler.wickets + (if (dismissalMethod != "Run Out") 1 else 0),
                      legalBalls = bowler.legalBalls + 1
                  )

                  totalLegalBalls += 1
                  wicketsLost += 1

                  fowList.add(FallOfWicket(wicketNum = wicketsLost, score = totalScore, batterName = striker.name, overs = "${totalLegalBalls / 6}.${totalLegalBalls % 6}"))
                  celebrationBanner = "🎯 WICKET! OUT! 🎯"
                  celebrationSub = "${striker.name} - $dismissalText"
                  commentaryText = "WICKET! ${striker.name} departs: $dismissalText"

                  deliveries.add(DeliveryItem(badge = "W", runsTotal = 0, isLegal = true, isWicket = true))

                  if (wicketsLost < 10) {
                      val nameToUse = if (incomingBatterInput.isBlank()) "Player ${batters.size + 1}" else incomingBatterInput
                      batters.add(BatterRecord(name = nameToUse))
                      strikerIdx = batters.lastIndex
                  }

                  fielderInput = ""
                  incomingBatterInput = ""
                  openWicketModal = false
              }

              // SCREEN SCAFFOLD
              Scaffold(
                  topBar = {
                      TopBrandHeader(
                          onNewMatchClick = { openNewMatchModal = true }
                      )
                  },
                  bottomBar = {
                      BottomNavRow(
                          currentNav = currentNav,
                          onNavSelect = { currentNav = it }
                      )
                  },
                  containerColor = Color(0xFF070B14)
              ) { paddingVals ->
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(paddingVals)
                          .padding(horizontal = 14.dp, vertical = 6.dp)
                  ) {
                      when (currentNav) {
                          ScreenNav.LIVE -> {
                              LiveScoringCloneScreen(
                                  battingTeam = battingTeam,
                                  score = totalScore,
                                  wickets = wicketsLost,
                                  legalBalls = totalLegalBalls,
                                  oversLimit = oversTotal,
                                  inningsNum = inningsNum,
                                  wides = wides,
                                  noBalls = noBalls,
                                  striker = batters.getOrNull(strikerIdx),
                                  nonStriker = batters.getOrNull(nonStrikerIdx),
                                  bowler = bowlers.getOrNull(bowlerIdx),
                                  recentBalls = deliveries,
                                  commentary = commentaryText,
                                  onRenameClick = { target, currentName ->
                                      renameTarget = target
                                      renameInput = currentName
                                      openRenameModal = true
                                  },
                                  onRun = { r -> recordDelivery(r, 0, true, "$r") },
                                  onBoundary = { is4 -> recordDelivery(if (is4) 4 else 6, 0, true, if (is4) "4" else "6") },
                                  onExtra = { isWd ->
                                      if (isWd) { wides++; recordDelivery(0, 1, false, "WD") }
                                      else { noBalls++; recordDelivery(0, 1, false, "NB") }
                                  },
                                  onRotate = { swapEnds() },
                                  onWicket = { openWicketModal = true },
                                  onUndo = {
                                      if (deliveries.isNotEmpty()) {
                                          val last = deliveries.removeAt(deliveries.lastIndex)
                                          totalScore -= last.runsTotal
                                          if (last.isLegal) totalLegalBalls -= 1
                                          if (last.isWicket) {
                                              wicketsLost -= 1
                                              if (fowList.isNotEmpty()) fowList.removeAt(fowList.lastIndex)
                                          }
                                      }
                                  }
                              )
                          }
                          ScreenNav.SCORECARD -> {
                              ScorecardTab(
                                  battingTeam = battingTeam,
                                  bowlingTeam = bowlingTeam,
                                  score = totalScore,
                                  wickets = wicketsLost,
                                  legalBalls = totalLegalBalls,
                                  wides = wides,
                                  noBalls = noBalls,
                                  batters = batters,
                                  bowlers = bowlers,
                                  fowList = fowList
                              )
                          }
                          ScreenNav.SETTINGS -> {
                              SettingsTab(
                                  battingTeam = battingTeam,
                                  bowlingTeam = bowlingTeam,
                                  overs = oversTotal,
                                  onOversChange = { oversTotal = it },
                                  onReset = {
                                      totalScore = 0
                                      wicketsLost = 0
                                      totalLegalBalls = 0
                                      deliveries.clear()
                                      fowList.clear()
                                  }
                              )
                          }
                      }

                      // VISUAL CELEBRATION OVERLAY
                      AnimatedVisibility(
                          visible = (celebrationBanner != null),
                          enter = slideInVertically(initialOffsetY = { -it }) + fadeIn(),
                          exit = slideOutVertically(targetOffsetY = { -it }) + fadeOut(),
                          modifier = Modifier.align(Alignment.TopCenter).padding(top = 10.dp)
                      ) {
                          Card(
                              colors = CardDefaults.cardColors(
                                  containerColor = if (celebrationBanner?.contains("FOUR") == true) Color(0xFF00E676) else Color(0xFFFFB300)
                              ),
                              shape = RoundedCornerShape(12.dp),
                              modifier = Modifier.fillMaxWidth(0.92f)
                          ) {
                              Column(
                                  modifier = Modifier.fillMaxWidth().padding(14.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally
                              ) {
                                  Text(celebrationBanner ?: "", color = Color.Black, fontSize = 22.sp, fontWeight = FontWeight.Black)
                                  if (celebrationSub.isNotEmpty()) {
                                      Text(celebrationSub, color = Color.Black.copy(alpha = 0.85f), fontSize = 14.sp, fontWeight = FontWeight.Bold)
                                  }
                              }
                          }
                      }
                  }
              }

              // RENAME MODAL DIALOG
              if (openRenameModal) {
                  AlertDialog(
                      onDismissRequest = { openRenameModal = false },
                      title = { Text("Rename $renameTarget", color = Color(0xFF00E676), fontWeight = FontWeight.Bold) },
                      text = {
                          OutlinedTextField(
                              value = renameInput,
                              onValueChange = { renameInput = it },
                              label = { Text("Enter New Name") },
                              modifier = Modifier.fillMaxWidth()
                          )
                      },
                      confirmButton = {
                          Button(
                              onClick = {
                                  val text = renameInput.trim()
                                  if (text.isNotEmpty()) {
                                      when (renameTarget) {
                                          "TEAM" -> battingTeam = text
                                          "STRIKER" -> batters.getOrNull(strikerIdx)?.name = text
                                          "NON_STRIKER" -> batters.getOrNull(nonStrikerIdx)?.name = text
                                          "BOWLER" -> bowlers.getOrNull(bowlerIdx)?.name = text
                                      }
                                  }
                                  openRenameModal = false
                              },
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF00E676))
                          ) {
                              Text("SAVE", color = Color.Black, fontWeight = FontWeight.Bold)
                          }
                      },
                      dismissButton = {
                          TextButton(onClick = { openRenameModal = false }) { Text("Cancel") }
                      }
                  )
              }

              // NEW MATCH MODAL DIALOG
              if (openNewMatchModal) {
                  AlertDialog(
                      onDismissRequest = { openNewMatchModal = false },
                      title = { Text("Create New Match", color = Color(0xFF00E676), fontWeight = FontWeight.Bold) },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              OutlinedTextField(
                                  value = newTeamInput,
                                  onValueChange = { newTeamInput = it },
                                  label = { Text("Team Name") },
                                  modifier = Modifier.fillMaxWidth()
                              )
                              OutlinedTextField(
                                  value = newOversInput,
                                  onValueChange = { newOversInput = it },
                                  label = { Text("Total Match Overs (e.g. 6, 10, 20)") },
                                  modifier = Modifier.fillMaxWidth()
                              )
                          }
                      },
                      confirmButton = {
                          Button(
                              onClick = {
                                  battingTeam = if (newTeamInput.isBlank()) "Team A" else newTeamInput
                                  oversTotal = newOversInput.toIntOrNull() ?: 6
                                  totalScore = 0
                                  wicketsLost = 0
                                  totalLegalBalls = 0
                                  deliveries.clear()
                                  fowList.clear()
                                  openNewMatchModal = false
                              },
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF00E676))
                          ) {
                              Text("START", color = Color.Black, fontWeight = FontWeight.Bold)
                          }
                      },
                      dismissButton = {
                          TextButton(onClick = { openNewMatchModal = false }) { Text("Cancel") }
                      }
                  )
              }

              // WICKET DETAILS DIALOG
              if (openWicketModal) {
                  AlertDialog(
                      onDismissRequest = { openWicketModal = false },
                      title = { Text("WICKET DETAILS", fontWeight = FontWeight.Bold, color = Color(0xFFFF5252)) },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Text("Dismissal Type:")
                              Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                  listOf("Caught", "Bowled", "LBW", "Run Out").forEach { m ->
                                      FilterChip(
                                          selected = (dismissalMethod == m),
                                          onClick = { dismissalMethod = m },
                                          label = { Text(m, fontSize = 11.sp) }
                                      )
                                  }
                              }
                              if (dismissalMethod == "Caught" || dismissalMethod == "Run Out") {
                                  OutlinedTextField(
                                      value = fielderInput,
                                      onValueChange = { fielderInput = it },
                                      label = { Text("Fielder Name") },
                                      modifier = Modifier.fillMaxWidth()
                                  )
                              }
                              OutlinedTextField(
                                  value = incomingBatterInput,
                                  onValueChange = { incomingBatterInput = it },
                                  label = { Text("Next Batter Name") },
