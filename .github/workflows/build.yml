name: Build RJ CricX Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Generate APK and Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 1: Android SDK Licenses Auto-Accept
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # Step 2: Gradle Setup
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      # Step 3: Ensure Gradlew Exists
      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      # Step 4: Signing Keystore Pehle Create Karna
      - name: Create Keystore for Signing
        run: |
          keytool -genkey -v -keystore playstore-release.keystore \
            -alias rjcricx \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "CricXPass@2026" \
            -keypass "CricXPass@2026" \
            -dname "CN=RJ CricX, O=Cricket App, C=IN"

      # Step 5: Android Project Configuration Files Ready Karna
      - name: Setup RJ CricX Project Structure
        run: |
          # gradle.properties (Memory aur AndroidX fix)
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RJ-CricX"
          include(":app")
          EOF

          # Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # Create directories
          mkdir -p app/src/main/java/com/rjcricx
          mkdir -p app/src/main/res/values
          touch app/proguard-rules.pro

          # app/build.gradle.kts (Isme signing aur build settings perfectly configured hain)
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.rjcricx"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.rjcricx"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("${rootDir}/playstore-release.keystore")
                      storePassword = "CricXPass@2026"
                      keyAlias = "rjcricx"
                      keyPassword = "CricXPass@2026"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
                  debug {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("androidx.compose.ui:ui:1.5.4")
              implementation("androidx.compose.ui:ui-graphics:1.5.4")
              implementation("androidx.compose.ui:ui-tooling-preview:1.5.4")
              implementation("androidx.compose.material3:material3:1.1.2")
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:allowBackup="true"
                  android:label="RJ CricX"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">RJ CricX</string>
          </resources>
          EOF

          # MainActivity.kt (Complete Live Scoring Screen)
          cat << 'EOF' > app/src/main/java/com/rjcricx/MainActivity.kt
          package com.rjcricx

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme {
                          RJCrickerApp()
                      }
                  }
              }
          }

          @Composable
          fun RJCrickerApp() {
              var runs by remember { mutableStateOf(0) }
              var wickets by remember { mutableStateOf(0) }
              var balls by remember { mutableStateOf(0) }

              Surface(
                  modifier = Modifier.fillMaxSize(),
                  color = Color(0xFF030A14)
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(20.dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.SpaceBetween
                  ) {
                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          Spacer(modifier = Modifier.height(30.dp))
                          Text(
                              text = "RJ CRICX",
                              color = Color(0xFF00E676),
                              fontSize = 28.sp,
                              fontWeight = FontWeight.Black
                          )
                          Text(
                              text = "Every Ball. Every Run. Every Moment.",
                              color = Color.LightGray,
                              fontSize = 12.sp
                          )
                          Spacer(modifier = Modifier.height(30.dp))

                          Card(
                              modifier = Modifier.fillMaxWidth(),
                              colors = CardDefaults.cardColors(containerColor = Color(0xFF0E1E36)),
                              shape = RoundedCornerShape(16.dp)
                          ) {
                              Column(
                                  modifier = Modifier.padding(24.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally
                              ) {
                                  Text(text = "SCORE", color = Color.Gray, fontSize = 14.sp)
                                  Text(
                                      text = "$runs / $wickets",
                                      color = Color.White,
                                      fontSize = 48.sp,
                                      fontWeight = FontWeight.Bold
                                  )
                                  Text(
                                      text = "Overs: ${balls / 6}.${balls % 6}",
                                      color = Color(0xFFFFD54F),
                                      fontSize = 20.sp,
                                      fontWeight = FontWeight.Medium
                                  )
                              }
                          }
                      }

                      Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              listOf(0, 1, 2, 3).forEach { r ->
                                  Button(
                                      onClick = { runs += r; balls++ },
                                      modifier = Modifier.weight(1f).height(50.dp),
                                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF132238))
                                  ) { Text("$r", fontSize = 18.sp) }
                              }
                          }
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              Button(
                                  onClick = { runs += 4; balls++ },
                                  modifier = Modifier.weight(1f).height(50.dp),
                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF00796B))
                              ) { Text("4", fontSize = 20.sp, fontWeight = FontWeight.Bold) }
                              Button(
                                  onClick = { runs += 6; balls++ },
                                  modifier = Modifier.weight(1f).height(50.dp),
                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFF57F17))
                              ) { Text("6", fontSize = 20.sp, fontWeight = FontWeight.Bold) }
                              Button(
                                  onClick = { if (wickets < 10) wickets++; balls++ },
                                  modifier = Modifier.weight(1f).height(50.dp),
                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFC62828))
                              ) { Text("OUT", fontSize = 16.sp, fontWeight = FontWeight.Bold) }
                          }
                          Button(
                              onClick = { runs = 0; wickets = 0; balls = 0 },
                              modifier = Modifier.fillMaxWidth().height(45.dp),
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF263238))
                          ) { Text("RESET MATCH") }
                          Spacer(modifier = Modifier.height(20.dp))
                      }
                  }
              }
          }
          EOF

      # Step 6: Testing APK Build Karna
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Step 7: Play Store Release AAB Build Karna (Already Signed!)
      - name: Build Play Store AAB
        run: ./gradlew bundleRelease --stacktrace

      # Step 8: Play Store AAB Download ke liye upload karna
      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: RJ-CricX-PlayStore-Ready-AAB
          path: app/build/outputs/bundle/release/app-release.aab

      # Step 9: Installable APK Download ke liye upload karna
      - name: Upload Testing APK
        uses: actions/upload-artifact@v4
        with:
          name: RJ-CricX-Direct-Install-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      # Step 10: Keystore Save Rakhna
      - name: Save Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: Keystore-Key-KeepSafe
          path: playstore-release.keystore
