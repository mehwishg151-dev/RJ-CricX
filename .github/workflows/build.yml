name: Build RJ CricX Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Is button se aap jab chahein 1-click me build chala sakte hain

jobs:
  build:
    name: Generate APK and Play Store AAB
    runs-on: ubuntu-latest

    steps:
      # Step 1: GitHub se code uthana
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Java 17 environment ready karna
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Gradle script ko execute permission dena
      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      # Step 4: Play Store ke liye Release Keystore (Sign Key) create karna
      - name: Create Keystore for Signing
        run: |
          keytool -genkey -v -keystore playstore-release.keystore \
            -alias rjcricx \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "CricXPass@2026" \
            -keypass "CricXPass@2026" \
            -dname "CN=RJ CricX, O=Cricket App, C=IN"

      # Step 5: Android App Bundle (AAB) aur Debug APK build karna
      - name: Build Android App (APK & AAB)
        run: |
          ./gradlew bundleRelease assembleDebug --stacktrace

      # Step 6: AAB ko Sign karna (Play Store bina sign kiye AAB reject kar deta hai)
      - name: Sign Play Store AAB
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore playstore-release.keystore \
            -storepass "CricXPass@2026" \
            -keypass "CricXPass@2026" \
            app/build/outputs/bundle/release/app-release.aab rjcricx

      # Step 7: Play Store wali AAB file upload karna (Download ke liye)
      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: RJ-CricX-PlayStore-Ready-AAB
          path: app/build/outputs/bundle/release/app-release.aab

      # Step 8: Phone me test karne ke liye APK upload karna
      - name: Upload Testing APK
        uses: actions/upload-artifact@v4
        with:
          name: RJ-CricX-Direct-Install-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      # Step 9: Signing Keystore ka backup save karna (Future updates ke liye)
      - name: Save Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: Keystore-Key-KeepSafe
          path: playstore-release.keystore
