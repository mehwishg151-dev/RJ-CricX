name: Build RJ CricX APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Capacitor & Android Project
        run: |
          npm init -y
          npm install @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2
          npx cap init "RJ CricX" "com.rjcricx.official" --web-dir www
          npx cap add android
          sed -i '/google-services/d' android/build.gradle
          sed -i '/google-services/d' android/app/build.gradle || true
          npx cap sync android

      - name: Inject 3D Cricket Launcher Icon into Phone Screen
        continue-on-error: true
        run: |
          sudo apt-get update -y && sudo apt-get install -y python3-pil
          python3 - << 'EOF'
          from PIL import Image, ImageDraw
          import os

          # Create 512x512 High-Res 3D Cricket Icon
          img = Image.new('RGBA', (512, 512), (6, 9, 14, 255))
          draw = ImageDraw.Draw(img)

          # Outer Neon Lime Hexagonal Ring
          draw.ellipse([18, 18, 494, 494], fill=(13, 19, 31), outline=(0, 255, 102), width=18)

          # 3D Red Leather Cricket Ball
          draw.ellipse([78, 78, 434, 434], fill=(210, 25, 45), outline=(255, 255, 255), width=6)

          # White Seam Stitches
          draw.arc([78, 78, 434, 434], start=45, end=225, fill=(255, 255, 255), width=8)
          draw.arc([78, 78, 434, 434], start=225, end=45, fill=(255, 255, 255), width=8)

          # Electric Neon X Crossing
          draw.line([135, 135, 377, 377], fill=(0, 255, 102), width=24)
          draw.line([377, 135, 135, 377], fill=(0, 255, 102), width=24)

          # Export to all Android Mipmap Sizes
          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          res_dir = 'android/app/src/main/res'
          for folder, s in sizes.items():
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)
              resized = img.resize((s, s), Image.LANCZOS)
              resized.save(os.path.join(target_dir, 'ic_launcher.png'))
              resized.save(os.path.join(target_dir, 'ic_launcher_round.png'))
              resized.save(os.path.join(target_dir, 'ic_launcher_foreground.png'))

          # Remove default vector xml so phone uses our PNG icon directly
          anydpi = os.path.join(res_dir, 'mipmap-anydpi-v26')
          if os.path.exists(anydpi):
              import shutil
              shutil.rmtree(anydpi)
          print('3D Mobile Launcher Icon Injected Successfully!')
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build Play Store AAB
        run: |
          cd android
          ./gradlew bundleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RJ-CricX-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: RJ-CricX-PlayStore-AAB
          path: android/app/build/outputs/bundle/debug/app-debug.aab
