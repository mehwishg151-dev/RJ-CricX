name: Build RJ CricX APK and Play Store AAB

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-all:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Create Native Project & Premium WhatsApp-Style Launcher Icon
        run: |
          mkdir -p app/src/main/java/com/rjcricx/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          # Smart Copy index.html
          if [ -f "index.html" ]; then
            cp index.html app/src/main/assets/index.html
          else
            find . -name "index.html" -not -path "./app/*" -exec cp {} app/src/main/assets/index.html \; -quit
          fi

          # 1. Generate Official Release Keystore for Google Play Store
          keytool -genkeypair -v -keystore release.keystore -alias rjcricx -keyalg RSA -keysize 2048 -validity 10000 -storepass rjcricx123 -keypass rjcricx123 -dname "CN=RJCricX, OU=App, O=CricX, L=Delhi, ST=Delhi, C=IN"

          # 2. Root gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          # 3. Root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 4. settings.gradle
          cat << 'EOF' > settings.gradle
          include ':app'
          rootProject.name = 'RJCricX'
          EOF

          # 5. Premium Red & Gold Cricket Ball Vector (Brand-New Pro Launcher Icon)
          cat << 'EOF' > app/src/main/res/drawable/app_icon.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- Dark Luxury Navy Circle Base -->
              <path android:fillColor="#070E17" android:pathData="M0,0h108v108h-108z"/>
              <!-- Metallic Gold Trophy Ring -->
              <path android:strokeColor="#FFD700" android:strokeWidth="3.5"
                  android:pathData="M54,54 m-44,0 a44,44 0 1,0 88,0 a44,44 0 1,0 -88,0"/>
              <!-- Deep Red Cricket Ball Core -->
              <path android:fillColor="#C62828" android:pathData="M54,54 m-36,0 a36,36 0 1,0 72,0 a36,36 0 1,0 -72,0"/>
              <!-- 3D Ball Gloss Highlight -->
              <path android:fillColor="#E53935" android:pathData="M54,54 m-30,-12 a30,30 0 0,1 58,14 a36,36 0 0,0 -58,-14"/>
              <!-- White Cricket Seam Stitching -->
              <path android:strokeColor="#FFFFFF" android:strokeWidth="2.8" android:strokeLineCap="round"
                  android:pathData="M54,18 C46,38 46,70 54,90"/>
              <!-- Center Gold RJ Monogram Accent -->
              <path android:strokeColor="#FFD700" android:strokeWidth="2.2" android:strokeLineCap="round"
                  android:pathData="M38,72 L70,36 M46,72 L40,66 M68,42 L62,36"/>
          </vector>
          EOF

          # 6. Adaptive Icon for Android 8.0 to Android 15 (Matches WhatsApp / FB Squircle/Circle)
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/app_icon"/>
              <foreground android:drawable="@drawable/app_icon"/>
          </adaptive-icon>
          EOF

          # 7. app/build.gradle (Version 7.0.0 - Play Store Signed)
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.rjcricx.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.rjcricx.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 7
                  versionName "7.0.0"
              }

              signingConfigs {
                  release {
                      storeFile file("../release.keystore")
                      storePassword "rjcricx123"
                      keyAlias "rjcricx"
                      keyPassword "rjcricx123"
                  }
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {}
          EOF

          # 8. AndroidManifest.xml (Adaptive Pro Launcher Icon Connected)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/app_icon"
                  android:roundIcon="@drawable/app_icon"
                  android:label="RJ CricX"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 9. MainActivity.java (Zero-Latency Native WebView)
          cat << 'EOF' > app/src/main/java/com/rjcricx/app/MainActivity.java
          package com.rjcricx.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  webView.setBackgroundColor(0xFF070E17);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setCacheMode(WebSettings.LOAD_NO_CACHE);
                  webView.clearCache(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      # Compile BOTH Direct APK and Play Store AAB
      - name: Build Android APK and Play Store AAB Bundle
        run: |
          gradle assembleDebug bundleRelease --no-daemon

      # 1. Output APK for your phone
      - name: Upload Installable APK (For Phone)
        uses: actions/upload-artifact@v4
        with:
          name: RJ-CricX-Installable-APK
          path: app/build/outputs/apk/debug/*.apk

      # 2. Output AAB for Google Play Store
      - name: Upload Play Store AAB (For Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: RJ-CricX-PlayStore-AAB
          path: app/build/outputs/bundle/release/*.aab

      # 3. Publish Both to GitHub Releases
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v7.0.0-build-${{ github.run_number }}
          name: "RJ CricX Pro Official (v7.0.0)"
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
