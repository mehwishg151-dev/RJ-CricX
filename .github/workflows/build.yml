name: Generate RJ CricX Code and Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Auto-generate RJ CricX Complete Project Structure
        run: |
          mkdir -p app/src/main/java/com/rjcricx/app/domain/engine
          mkdir -p app/src/main/java/com/rjcricx/app/ui/screens/live
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper

          # 1. Root settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RJ CricX"
          include(":app")
          EOF

          # 2. Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.3.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
          }
          EOF

          # 3. App build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.rjcricx.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.rjcricx.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }

              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.11"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.04.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui-tooling-preview")
          }
          EOF

          # 4. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="RJ CricX"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 5. Core Cricket Engine (MCC Compliant)
          cat << 'EOF' > app/src/main/java/com/rjcricx/app/domain/engine/CricketScoringEngine.kt
          package com.rjcricx.app.domain.engine

          data class MatchScore(
              val runs: Int = 0,
              val wickets: Int = 0,
              val legalBalls: Int = 0,
              val strikerRuns: Int = 0,
              val strikerBalls: Int = 0,
              val nonStrikerRuns: Int = 0,
              val nonStrikerBalls: Int = 0,
              val isFreeHit: Boolean = false,
              val strikerName: String = "Striker",
              val nonStrikerName: String = "Non-Striker"
          ) {
              val oversNotation: String get() = "${legalBalls / 6}.${legalBalls % 6}"
          }

          class CricketScoringEngine {
              fun processBall(state: MatchScore, runsOffBat: Int, isWide: Boolean, isNoBall: Boolean, isWicket: Boolean): MatchScore {
                  val extras = if (isWide || isNoBall) 1 else 0
                  val totalBallRuns = runsOffBat + extras
                  val isLegal = !isWide && !isNoBall
                  val newLegalBalls = if (isLegal) state.legalBalls + 1 else state.legalBalls
                  val isOverEnd = isLegal && (newLegalBalls % 6 == 0)

                  var sRuns = state.strikerRuns + if (!isWide) runsOffBat else 0
                  var sBalls = state.strikerBalls + if (!isWide) 1 else 0
                  var sName = state.strikerName
                  var nsName = state.nonStrikerName
                  var nsRuns = state.nonStrikerRuns
                  var nsBalls = state.nonStrikerBalls
                  var w = state.wickets

                  if (isWicket) {
                      w += 1
                      sName = "New Batter $w"
                      sRuns = 0
                      sBalls = 0
                  } else {
                      val shouldRotate = (runsOffBat % 2 != 0) xor isOverEnd
                      if (shouldRotate) {
                          val tempName = sName; sName = nsName; nsName = tempName
                          val tempR = sRuns; sRuns = nsRuns; nsRuns = tempR
                          val tempB = sBalls; sBalls = nsBalls; nsBalls = tempB
                      }
                  }

                  return state.copy(
                      runs = state.runs + totalBallRuns,
                      wickets = w,
                      legalBalls = newLegalBalls,
                      strikerRuns = sRuns,
                      strikerBalls = sBalls,
                      nonStrikerRuns = nsRuns,
                      nonStrikerBalls = nsBalls,
                      strikerName = sName,
                      nonStrikerName = nsName,
                      isFreeHit = isNoBall
                  )
              }
          }
          EOF

          # 6. Complete UI (Material 3 Live Scoring)
          cat << 'EOF' > app/src/main/java/com/rjcricx/app/MainActivity.kt
          package com.rjcricx.app

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.rjcricx.app.domain.engine.CricketScoringEngine
          import com.rjcricx.app.domain.engine.MatchScore

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      val engine = remember { CricketScoringEngine() }
                      var score by remember { mutableStateOf(MatchScore()) }

                      Column(
                          modifier = Modifier
                              .fillMaxSize()
                              .background(Color(0xFF070B19))
                              .padding(16.dp),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Text("RJ CRICX — MATCH CENTRE", color = Color(0xFF00E676), fontSize = 18.sp, fontWeight = FontWeight.Bold)
                          Spacer(modifier = Modifier.height(20.dp))

                          Card(
                              colors = CardDefaults.cardColors(containerColor = Color(0xFF131C31)),
                              shape = RoundedCornerShape(16.dp),
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              Column(modifier = Modifier.padding(20.dp)) {
                                  Text("${score.runs} / ${score.wickets}", fontSize = 48.sp, fontWeight = FontWeight.Black, color = Color.White)
                                  Text("Overs: ${score.oversNotation}", fontSize = 16.sp, color = Color(0xFF90A4AE))
                                  if (score.isFreeHit) {
                                      Text("FREE HIT!", color = Color(0xFFFFD600), fontWeight = FontWeight.Bold)
                                  }
                                  Divider(modifier = Modifier.padding(vertical = 12.dp), color = Color(0xFF263238))
                                  Text("🏏 ${score.strikerName}*: ${score.strikerRuns} (${score.strikerBalls})", color = Color(0xFF00E676))
                                  Text("   ${score.nonStrikerName}: ${score.nonStrikerRuns} (${score.nonStrikerBalls})", color = Color.White)
                              }
                          }

                          Spacer(modifier = Modifier.weight(1f))

                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              listOf(0, 1, 2, 3, 4, 6).forEach { r ->
                                  Button(
                                      onClick = { score = engine.processBall(score, r, false, false, false) },
                                      modifier = Modifier.weight(1f),
                                      colors = ButtonDefaults.buttonColors(containerColor = if (r >= 4) Color(0xFF00C853) else Color(0xFF1E293B))
                                  ) {
                                      Text("$r", color = Color.White, fontWeight = FontWeight.Bold)
                                  }
                              }
                          }

                          Spacer(modifier = Modifier.height(10.dp))

                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              Button(
                                  onClick = { score = engine.processBall(score, 0, true, false, false) },
                                  modifier = Modifier.weight(1f),
                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF37474F))
                              ) { Text("WD") }

                              Button(
                                  onClick = { score = engine.processBall(score, 0, false, true, false) },
                                  modifier = Modifier.weight(1f),
                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF37474F))
                              ) { Text("NB") }

                              Button(
                                  onClick = { score = engine.processBall(score, 0, false, false, true) },
                                  modifier = Modifier.weight(2f),
                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFD32F2F))
                              ) { Text("WICKET (OUT)", fontWeight = FontWeight.Bold) }
                          }
                      }
                  }
              }
          }
          EOF

          # Gradle Wrapper generate karein
          gradle wrapper
          chmod +x gradlew

      - name: Commit Generated Project to Repository
        run: |
          git config --global user.name "RJ CricX Bot"
          git config --global user.email "bot@rjcricx.local"
          git add .
          git commit -m "Complete Android Project Generated for RJ CricX" || echo "No changes"
          git push origin main || echo "Already up to date"

      - name: Build Debug & Release APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: RJ-CricX-Installable-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
