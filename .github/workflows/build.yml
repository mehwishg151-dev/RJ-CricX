      # Step 4: Play Store Keystore Create Karna
      - name: Create Keystore
        run: |
          mkdir -p app
          rm -f app/playstore-release.keystore
          keytool -genkey -v -keystore app/playstore-release.keystore \
            -alias rjcricx \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "CricXPass@2026" \
            -keypass "CricXPass@2026" \
            -dname "CN=RJ CricX, O=Cricket App, C=IN"

      # Step 5: Official Standalone Gradle 8.5 Download & Wrapper Generator
      - name: Setup Gradle 8.5 Binary & Wrapper
        run: |
          curl -sLo gradle-8.5-bin.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          ./gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          rm -rf gradle-8.5 gradle-8.5-bin.zip

      # Step 6: Testing APK Build Karna
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # Step 7: Play Store Signed AAB Build Karna
      - name: Build Play Store AAB
        run: ./gradlew bundleRelease --stacktrace --no-daemon

      # Step 8: Play Store AAB Artifact Upload
      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: RJ-CricX-PlayStore-Ready-AAB
          path: app/build/outputs/bundle/release/app-release.aab

      # Step 9: Installable APK Artifact Upload
      - name: Upload Testing APK
        uses: actions/upload-artifact@v4
        with:
          name: RJ-CricX-Direct-Install-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      # Step 10: Keystore Backup Save
      - name: Save Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: Keystore-Key-KeepSafe
          path: app/playstore-release.keystore
