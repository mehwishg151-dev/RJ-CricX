          // 2. LIVE SCORING SCREEN (EXACT 1-TO-1 MATCH OF SCREENSHOT)
          @Composable
          fun LiveScoringCloneScreen(
              battingTeam: String,
              score: Int,
              wickets: Int,
              legalBalls: Int,
              oversLimit: Int,
              inningsNum: Int,
              wides: Int,
              noBalls: Int,
              striker: BatterRecord?,
              nonStriker: BatterRecord?,
              bowler: BowlerRecord?,
              recentBalls: List<DeliveryItem>,
              commentary: String,
              onRenameClick: (target: String, currentName: String) -> Unit,
              onRun: (Int) -> Unit,
              onBoundary: (Boolean) -> Unit,
              onExtra: (Boolean) -> Unit,
              onRotate: () -> Unit,
              onWicket: () -> Unit,
              onUndo: () -> Unit
          ) {
              val crr = if (legalBalls == 0) 0.0 else (score.toDouble() * 6.0) / legalBalls

              Column(
                  modifier = Modifier.fillMaxSize(),
                  verticalArrangement = Arrangement.spacedBy(8.dp)
              ) {
                  // A. SCOREBOARD CARD
                  Card(
                      modifier = Modifier
                          .fillMaxWidth()
                          .border(1.dp, Color(0xFF1E293B), RoundedCornerShape(14.dp)),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFF0D1527)),
                      shape = RoundedCornerShape(14.dp)
                  ) {
                      Column(modifier = Modifier.padding(14.dp)) {
                          // Team Header
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Text(battingTeam, color = Color.White, fontFamily = FontFamily.Monospace, fontWeight = FontWeight.Bold, fontSize = 13.sp)
                                  Spacer(modifier = Modifier.width(6.dp))
                                  Text(
                                      "✎ Rename",
                                      color = Color(0xFF00E676),
                                      fontSize = 11.sp,
                                      modifier = Modifier.clickable { onRenameClick("TEAM", battingTeam) }
                                  )
                              }
                              Text("INN $inningsNum OF 2", color = Color(0xFF00E676), fontFamily = FontFamily.Monospace, fontWeight = FontWeight.Bold, fontSize = 11.sp)
                          }

                          Spacer(modifier = Modifier.height(10.dp))

                          // Big Score Row: "19 /0" and "1.0 /6 ov"
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.Bottom
                          ) {
                              Row(verticalAlignment = Alignment.Bottom) {
                                  Text("$score", color = Color.White, fontSize = 54.sp, fontWeight = FontWeight.Bold)
                                  Text("/$wickets", color = Color(0xFF00E676), fontSize = 42.sp, fontWeight = FontWeight.Bold)
                              }
                              Row(verticalAlignment = Alignment.Bottom) {
                                  Text("${legalBalls / 6}.${legalBalls % 6}", color = Color.White, fontSize = 28.sp, fontWeight = FontWeight.Bold)
                                  Text(" /$oversLimit ov", color = Color(0xFF64748B), fontSize = 14.sp)
                              }
                          }

                          Spacer(modifier = Modifier.height(12.dp))

                          // Partnership Pill Box
                          Box(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .border(1.dp, Color(0xFF00E5FF).copy(alpha = 0.5f), RoundedCornerShape(8.dp))
                                  .padding(horizontal = 10.dp, vertical = 6.dp)
                          ) {
                              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                  Text("PARTNERSHIP", color = Color(0xFF00E5FF), fontSize = 11.sp, fontFamily = FontFamily.Monospace)
                                  Text("0 runs (0b)", color = Color(0xFF00E5FF), fontSize = 11.sp, fontFamily = FontFamily.Monospace)
                              }
                          }

                          Spacer(modifier = Modifier.height(12.dp))

                          // CRR, REQ RR, EXTRAS
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween
                          ) {
                              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                  Text("CRR", color = Color(0xFF64748B), fontSize = 10.sp, fontFamily = FontFamily.Monospace)
                                  Text(String.format(Locale.US, "%.2f", crr), color = Color(0xFF00E676), fontSize = 14.sp, fontWeight = FontWeight.Bold, fontFamily = FontFamily.Monospace)
                              }
                              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                  Text("REQ RR", color = Color(0xFF64748B), fontSize = 10.sp, fontFamily = FontFamily.Monospace)
                                  Text("--", color = Color(0xFFFFB300), fontSize = 14.sp, fontWeight = FontWeight.Bold, fontFamily = FontFamily.Monospace)
                              }
                              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                  Text("EXTRAS", color = Color(0xFF64748B), fontSize = 10.sp, fontFamily = FontFamily.Monospace)
                                  Text("${wides + noBalls} (wd $wides, nb $noBalls)", color = Color(0xFF38BDF8), fontSize = 13.sp, fontFamily = FontFamily.Monospace)
                              }
                          }
                      }
                  }

                  // B. STRIKER CARD (GREEN GLOWING BORDER)
                  Card(
                      modifier = Modifier
                          .fillMaxWidth()
                          .border(1.2.dp, Color(0xFF00E676), RoundedCornerShape(10.dp)),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFF0B1424)),
                      shape = RoundedCornerShape(10.dp)
                  ) {
                      Row(
                          modifier = Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 8.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Text("▶ ", color = Color(0xFF00E676), fontSize = 12.sp)
                              Text(striker?.name ?: "Sameer (C)", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 14.sp)
                              Spacer(modifier = Modifier.width(6.dp))
                              Text("✎ Rename", color = Color(0xFF00E676), fontSize = 11.sp, modifier = Modifier.clickable { onRenameClick("STRIKER", striker?.name ?: "") })
                          }
                          Column(horizontalAlignment = Alignment.End) {
                              Text("${striker?.runs ?: 0}  (${striker?.balls ?: 0}b)", color = Color(0xFF00E676), fontWeight = FontWeight.Bold, fontSize = 13.sp)
                              Text("SR: ${striker?.strikeRateFormatted ?: "0.00"}", color = Color(0xFFFFB300), fontSize = 11.sp, fontFamily = FontFamily.Monospace)
                          }
                      }
                  }

                  // C. NON-STRIKER CARD (DARK BORDER)
                  Card(
                      modifier = Modifier
                          .fillMaxWidth()
                          .border(1.dp, Color(0xFF1E293B), RoundedCornerShape(10.dp)),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFF0B1424)),
                      shape = RoundedCornerShape(10.dp)
                  ) {
                      Row(
                          modifier = Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 8.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Text("▷ ", color = Color(0xFF64748B), fontSize = 12.sp)
                              Text(nonStriker?.name ?: "Rohan (wk)", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 14.sp)
                              Spacer(modifier = Modifier.width(6.dp))
                              Text("✎ Rename", color = Color(0xFF64748B), fontSize = 11.sp, modifier = Modifier.clickable { onRenameClick("NON_STRIKER", nonStriker?.name ?: "") })
                          }
                          Column(horizontalAlignment = Alignment.End) {
                              Text("${nonStriker?.runs ?: 0}  (${nonStriker?.balls ?: 0}b)", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 13.sp)
                              Text("SR: ${nonStriker?.strikeRateFormatted ?: "0.00"}", color = Color(0xFFFFB300), fontSize = 11.sp, fontFamily = FontFamily.Monospace)
                          }
                      }
                  }

                  // D. BOWLER STRIP
                  Row(
                      modifier = Modifier.fillMaxWidth().padding(horizontal = 6.dp, vertical = 2.dp),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Text("BOWLER: ", color = Color(0xFF64748B), fontSize = 11.sp, fontFamily = FontFamily.Monospace)
                          Text(bowler?.name ?: "Sunny (C)", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 12.sp)
                          Spacer(modifier = Modifier.width(6.dp))
                          Text("✎ Rename", color = Color(0xFF00E676), fontSize = 10.sp, modifier = Modifier.clickable { onRenameClick("BOWLER", bowler?.name ?: "") })
                      }
                      Text(
                          "${bowler?.oversFormatted ?: "0.0"} ov • ${bowler?.runsConceded ?: 0}r • ${bowler?.wickets ?: 0}w",
                          color = Color(0xFF00E676),
                          fontSize = 12.sp,
                          fontFamily = FontFamily.Monospace,
                          fontWeight = FontWeight.Bold
                      )
                  }

                  // E. NUMBER ROW (0, 1, 2, 3)
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      listOf(0, 1, 2, 3).forEach { r ->
                          Button(
                              onClick = { onRun(r) },
                              modifier = Modifier.weight(1f).height(46.dp),
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF131D31)),
                              shape = RoundedCornerShape(8.dp)
                          ) {
                              Text("$r", color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.Bold)
                          }
                      }
                  }

                  // F. BIG IMPACT BUTTONS: 4 FOUR, 6 SIX, OUT
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      // 4 FOUR
                      Button(
                          onClick = { onBoundary(true) },
                          modifier = Modifier.weight(1.5f).height(54.dp).border(1.2.dp, Color(0xFF00E676), RoundedCornerShape(8.dp)),
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF063A29)),
                          shape = RoundedCornerShape(8.dp)
                      ) {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Text("4  FOUR  ", color = Color(0xFF00E676), fontSize = 16.sp, fontWeight = FontWeight.Black)
                              Text("⚡", fontSize = 16.sp)
                          }
                      }

                      // 6 SIX
                      Button(
                          onClick = { onBoundary(false) },
                          modifier = Modifier.weight(1.2f).height(54.dp).border(1.2.dp, Color(0xFFFFB300), RoundedCornerShape(8.dp)),
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF332009)),
                          shape = RoundedCornerShape(8.dp)
                      ) {
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Text("6  SIX", color = Color(0xFFFFB300), fontSize = 14.sp, fontWeight = FontWeight.Black)
                              Text("🔥", fontSize = 13.sp)
                          }
                      }

                      // OUT
                      Button(
                          onClick = onWicket,
                          modifier = Modifier.weight(1.2f).height(54.dp),
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFE11D48)),
                          shape = RoundedCornerShape(8.dp)
                      ) {
                          Text("OUT  ✕", color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Black)
                      }
                  }

                  // G. AUXILIARY ROW: WIDE, NO-BALL, ROTATE, UNDO
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(6.dp)
                  ) {
                      Button(onClick = { onExtra(true) }, modifier = Modifier.weight(1f).height(38.dp), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF131D31)), shape = RoundedCornerShape(8.dp), contentPadding = PaddingValues(0.dp)) {
                          Text("WIDE (+1)", color = Color(0xFF94A3B8), fontSize = 10.sp, fontFamily = FontFamily.Monospace)
                      }
                      Button(onClick = { onExtra(false) }, modifier = Modifier.weight(1f).height(38.dp), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF131D31)), shape = RoundedCornerShape(8.dp), contentPadding = PaddingValues(0.dp)) {
                          Text("NO-BALL (+1)", color = Color(0xFF94A3B8), fontSize = 10.sp, fontFamily = FontFamily.Monospace)
                      }
                      Button(onClick = onRotate, modifier = Modifier.weight(1f).height(38.dp), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF131D31)), shape = RoundedCornerShape(8.dp), contentPadding = PaddingValues(0.dp)) {
                          Text("⇄ ROTATE", color = Color.White, fontSize = 10.sp, fontFamily = FontFamily.Monospace)
                      }
                      Button(onClick = onUndo, modifier = Modifier.weight(1f).height(38.dp), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF131D31)), shape = RoundedCornerShape(8.dp), contentPadding = PaddingValues(0.dp)) {
                          Text("UNDO ↶", color = Color.White, fontSize = 10.sp, fontFamily = FontFamily.Monospace)
                      }
                  }

                  // H. LIVE RADAR STREAM (THIS OVER)
                  Box(
                      modifier = Modifier
                          .fillMaxWidth()
                          .border(1.dp, Color(0xFF1E293B), RoundedCornerShape(10.dp))
                          .background(Color(0xFF0B1424))
                          .padding(horizontal = 12.dp, vertical = 8.dp)
                  ) {
                      Column {
                          Text("LIVE RADAR STREAM (THIS OVER)", color = Color(0xFF64748B), fontSize = 10.sp, fontFamily = FontFamily.Monospace)
                          Spacer(modifier = Modifier.height(4.dp))
                          if (recentBalls.isEmpty()) {
                              Text("• No deliveries yet in this over", color = Color(0xFF475569), fontSize = 12.sp)
                          } else {
                              LazyRow(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                  items(recentBalls.takeLast(6)) { b ->
                                      val color = when (b.badge) {
                                          "4" -> Color(0xFF00E676)
                                          "6" -> Color(0xFFFFB300)
                                          "W" -> Color(0xFFE11D48)
                                          else -> Color.White
                                      }
                                      Text(b.badge, color = color, fontSize = 12.sp, fontWeight = FontWeight.Bold, fontFamily = FontFamily.Monospace)
                                  }
                              }
                          }
                      }
                  }

                  // I. RJ CRICX COMMENTARY BOX
                  Card(
                      modifier = Modifier
                          .fillMaxWidth()
                          .border(1.dp, Color(0xFF1E293B), RoundedCornerShape(10.dp)),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFF0B1424)),
                      shape = RoundedCornerShape(10.dp)
                  ) {
                      Row(modifier = Modifier.fillMaxWidth()) {
                          // Neon Green Left Edge
                          Box(modifier = Modifier.width(4.dp).height(52.dp).background(Color(0xFF00E676)))
                          Column(modifier = Modifier.padding(horizontal = 10.dp, vertical = 8.dp)) {
                              Text("RJ CRICX COMMENTARY", color = Color(0xFF64748B), fontSize = 9.sp, fontFamily = FontFamily.Monospace)
                              Spacer(modifier = Modifier.height(2.dp))
                              Text(commentary, color = Color.White, fontSize = 12.sp, fontStyle = androidx.compose.ui.text.font.FontStyle.Italic)
                          }
                      }
                  }
              }
          }

